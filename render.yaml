services:
  - type: web
    name: opd-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSPITAL_NAME
        value: "City General Hospital"
      - key: FRONTEND_URL
        value: https://opd-lsx7.onrender.com
    plan: free
    autoDeploy: yes

  # Frontend static site (Blueprint). The backend URL below must match
  # your backend service's onrender.com URL. IMPORTANT: VITE_API_BASE_URL
  # must end with /api and any change requires a rebuild/redeploy,
  # because Vite bakes VITE_* vars into the JS bundle at BUILD time.
  - type: web
    name: opd-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://out-patient-departmnet.onrender.com/api
    # SPA fallback: serve index.html for all routes (fixes 404 on
    # refresh / direct open of /patients/new, /dashboard, etc.)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free
    autoDeploy: yes
